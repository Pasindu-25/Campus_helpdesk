<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campus Hub | SLIIT</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        /* Modern Font & Premium Glassmorphism styling */
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --brand-primary: #4f46e5;
            --brand-primary-light: #6366f1;
            --brand-secondary: #06b6d4;
            --brand-accent: #a855f7;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.72);
            --glass-card: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.85);
            --glass-shadow: 0 25px 60px -15px rgba(79, 70, 229, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.7);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            margin: 0;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
            color: var(--text-main);
        }

        /* Ambient Glowing Canvas Orbs (Matching Glassmorphism Light Portal) */
        .ambient-glow-1 {
            position: fixed;
            top: -120px;
            left: -100px;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.22) 0%, rgba(168, 85, 247, 0.12) 40%, rgba(248, 250, 252, 0) 70%);
            border-radius: 50%;
            filter: blur(50px);
            z-index: 0;
            pointer-events: none;
            animation: pulseOrb 12s ease-in-out infinite alternate;
        }

        .ambient-glow-2 {
            position: fixed;
            bottom: -150px;
            right: -100px;
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.18) 0%, rgba(79, 70, 229, 0.14) 45%, rgba(248, 250, 252, 0) 70%);
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
            animation: pulseOrb 15s ease-in-out infinite alternate-reverse;
        }

        .ambient-glow-center {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.08) 0%, rgba(248, 250, 252, 0) 70%);
            border-radius: 50%;
            filter: blur(40px);
            z-index: 0;
            pointer-events: none;
        }

        /* Subtle modern grid overlay */
        .grid-backdrop {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(99, 102, 241, 0.07) 1px, transparent 1px);
            background-size: 28px 28px;
            z-index: 0;
            pointer-events: none;
            opacity: 0.8;
        }

        /* Split Card Container - Frosted Glass */
        .login-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            background: var(--glass-card);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: var(--glass-shadow);
            overflow: hidden;
            max-width: 980px;
            width: 100%;
            min-height: 580px;
            animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .login-wrapper:hover {
            box-shadow: 0 30px 70px -15px rgba(79, 70, 229, 0.22), 0 0 0 1px rgba(255, 255, 255, 0.9);
        }

        /* Left Side: Campus Image Section */
        .login-image-section {
            flex: 1.15;
            background: url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80') center center/cover no-repeat;
            position: relative;
            display: none;
            overflow: hidden;
        }

        /* Refined Frosted Overlay for Image */
        .login-image-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, rgba(30, 27, 75, 0.78) 0%, rgba(79, 70, 229, 0.82) 50%, rgba(6, 182, 212, 0.72) 100%);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
            padding: 3.5rem 3rem;
            position: relative;
        }

        /* Decorative glass badge on image side */
        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            align-self: flex-start;
        }

        .login-image-overlay h2 {
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            color: #ffffff;
            line-height: 1.2;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s both;
        }

        .login-image-overlay h2 span {
            background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-image-overlay p {
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.88);
            line-height: 1.6;
            margin-bottom: 0;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        /* Glassmorphism Feature Chips in overlay */
        .glass-status-chip {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 12px 18px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .pulse-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse-ring 2s infinite;
        }

        /* Right Side: Form Section */
        .login-form-section {
            flex: 1.05;
            padding: 3.5rem 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        /* Floating frosted icon container */
        .icon-halo {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px auto;
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.12) 0%, rgba(168, 85, 247, 0.16) 100%);
            border: 1px solid rgba(99, 102, 241, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.2);
            animation: floatSlow 5s ease-in-out infinite alternate;
        }

        .login-header i {
            font-size: 2.4rem;
            background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header h3 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .login-header p {
            color: #64748b;
            font-size: 0.92rem;
            font-weight: 500;
        }

        /* Form Labels */
        .form-label.tracking-wide {
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            color: #475569;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        /* Frosted Glass Inputs */
        .input-group {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(203, 213, 225, 0.7);
            border-radius: 14px !important;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .input-group:focus-within {
            background: #ffffff;
            border-color: var(--brand-primary-light);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15), 0 4px 12px rgba(99, 102, 241, 0.08);
            transform: translateY(-1px);
        }

        .input-group-text {
            background-color: transparent !important;
            border: none !important;
            padding: 0.9rem 1rem 0.9rem 1.25rem;
            color: #94a3b8 !important;
            transition: color 0.3s ease;
            font-size: 1.1rem;
        }

        .input-group:focus-within .input-group-text {
            color: var(--brand-primary) !important;
        }

        .form-control {
            background-color: transparent !important;
            border: none !important;
            padding: 0.9rem 1.25rem 0.9rem 0.4rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: #0f172a;
        }

        .form-control::placeholder {
            color: #94a3b8;
            font-weight: 400;
            font-size: 0.92rem;
        }

        .form-control:focus {
            box-shadow: none;
            background-color: transparent;
            color: #0f172a;
        }

        /* Glassmorphism Alert */
        .alert-danger {
            background: rgba(254, 226, 226, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #991b1b;
            border-radius: 12px;
            font-weight: 500;
        }

        /* Shimmering Gradient Button */
        .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 50%, #7c3aed 100%) !important;
            border: none !important;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.2px;
            border-radius: 9999px !important;
            color: #ffffff !important;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.45);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transition: 0.5s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 32px -5px rgba(79, 70, 229, 0.55);
        }

        .btn-primary:hover::after {
            left: 100%;
        }

        .btn-primary:active {
            transform: translateY(0);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
        }

        /* Back to Home Link */
        .text-muted.fw-semibold {
            color: #64748b !important;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .text-muted.fw-semibold:hover {
            color: var(--brand-primary) !important;
            background: rgba(99, 102, 241, 0.08);
            transform: translateX(-3px);
        }

        /* Responsive Breakpoints */
        @media (min-width: 768px) {
            .login-image-section { display: flex; }
            .login-form-section { padding: 3.5rem; }
        }

        @media (max-width: 576px) {
            body { padding: 16px; }
            .login-wrapper { border-radius: 20px; }
            .login-form-section { padding: 2rem 1.5rem; }
        }

        /* Keyframes */
        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(30px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes floatSlow {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-6px); }
        }

        @keyframes pulseOrb {
            0% { transform: scale(1) translate(0, 0); opacity: 0.7; }
            100% { transform: scale(1.12) translate(20px, 30px); opacity: 1; }
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Staggered form elements animation */
        .stagger-1 { animation: fadeInUp 0.5s ease-out 0.2s both; }
        .stagger-2 { animation: fadeInUp 0.5s ease-out 0.3s both; }
        .stagger-3 { animation: fadeInUp 0.5s ease-out 0.4s both; }
        .stagger-4 { animation: fadeInUp 0.5s ease-out 0.5s both; }
    </style>
</head>
<body>

<!-- Ambient Ambient Gradient Orbs & Texture Backdrop -->
<div class="ambient-glow-1"></div>
<div class="ambient-glow-2"></div>
<div class="ambient-glow-center"></div>
<div class="grid-backdrop"></div>

<div class="login-wrapper">

    <!-- Left Side: Campus Image -->
    <div class="login-image-section">
        <div class="login-image-overlay">
            <div>
                <div class="brand-badge mb-4">
                    <i class="bi bi-shield-check text-white"></i>
                    <span>Official Support Network</span>
                </div>
                <h2>SLIIT </h2>
                <p>Empowering Students & Staff through unified digital solutions.</p>
            </div>

            <!-- Glassmorphism Live Status Indicator -->
            <div class="glass-status-chip">
                <span class="pulse-indicator"></span>
                <div>
                    <div class="small fw-bold text-white">Central Support Active</div>
                    <div style="font-size: 0.76rem; color: rgba(255,255,255,0.75);">SLA Monitored • End-to-End Encryption</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Side: Login Form -->
    <div class="login-form-section">

        <!-- Header Section -->
        <div class="login-header">
            <div class="icon-halo">
                <i class="bi bi-person-circle drop-shadow"></i>
            </div>
            <h3 class="fw-bold mt-2 stagger-1 text-dark">Welcome Back!</h3>
            <p class="text-muted small stagger-1">Login to Access Your SLIIT Account</p>
        </div>

        <!-- Error Message Display Area (Thymeleaf logic untouched) -->
        <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show text-center small stagger-1" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Login Form (Thymeleaf logic untouched) -->
        <form th:action="@{/login}" method="POST">

            <!-- Email Field -->
            <div class="mb-4 stagger-2">
                <label for="email" class="form-label text-secondary small fw-bold tracking-wide">EMAIL ADDRESS</label>
                <div class="input-group shadow-sm rounded-3 overflow-hidden">
                    <span class="input-group-text border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" class="form-control border-start-0" id="email" name="email"
                           placeholder="e.g. student@sliit.lk" required autofocus>
                </div>
            </div>

            <!-- Password Field -->
            <div class="mb-4 stagger-3">
                <label for="password" class="form-label text-secondary small fw-bold tracking-wide">PASSWORD</label>
                <div class="input-group shadow-sm rounded-3 overflow-hidden">
                    <span class="input-group-text border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" name="password"
                           placeholder="Enter your password" required>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="d-grid mb-4 stagger-4">
                <button type="submit" class="btn btn-primary rounded-pill fw-bold">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Secure Login
                </button>
            </div>

        </form>

        <!-- Back to Home Link -->
        <div class="text-center stagger-4">
            <a th:href="@{/}" class="text-decoration-none small text-muted fw-semibold">
                <i class="bi bi-arrow-left me-1"></i> Back to Home Page
            </a>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
