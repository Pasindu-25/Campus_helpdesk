<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Activation - Update Password</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
        var(--bg-base): #f8fafc;
            --brand-primary: #4f46e5;
            --text-main: #0f172a;

            /* Glassmorphism system */
            --glass-card: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.85);
            --glass-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.15), 0 0 1px 1px rgba(255, 255, 255, 0.9) inset;
        }

        body {
            background-color: var(--bg-base);
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            color: var(--text-main);
        }

        /* Ambient glowing background orbs */
        .ambient-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            animation: orbFloat 15s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.3) 0%, rgba(124, 58, 237, 0.1) 70%, transparent 100%);
            top: -50px; right: -50px;
        }

        .orb-2 {
            width: 450px; height: 450px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.25) 0%, rgba(16, 185, 129, 0.1) 70%, transparent 100%);
            bottom: -50px; left: -50px;
            animation-delay: -5s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-30px, 40px) scale(1.05); }
        }

        /* Glass Panel Styling (Apple-like) */
        .activation-card {
            background: var(--glass-card);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 45px 40px;
            border-radius: 28px;
            max-width: 500px;
            width: 100%;
            z-index: 1;
            position: relative;
        }

        /* Icon Glow Wrapper */
        .icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.15) 0%, rgba(124, 58, 237, 0.2) 100%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.2);
            margin-bottom: 20px;
        }

        /* Input Glass Styling */
        .form-control-glass {
            background: rgba(255, 255, 255, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.8) !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02) inset;
            color: #0f172a;
            font-weight: 500;
            padding: 14px 20px;
            transition: all 0.3s ease;
        }

        .form-control-glass:focus {
            background: rgba(255, 255, 255, 0.9) !important;
            border-color: rgba(79, 70, 229, 0.5) !important;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1), 0 2px 8px rgba(0,0,0,0.02) inset;
            outline: none;
        }

        .form-control-glass.is-invalid {
            border-color: #ef4444 !important;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1), 0 2px 8px rgba(0,0,0,0.02) inset;
        }
        .form-control-glass.is-valid {
            border-color: #10b981 !important;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1), 0 2px 8px rgba(0,0,0,0.02) inset;
        }

        /* Primary Action Button */
        .btn-custom-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border: none;
            font-weight: 700;
            padding: 14px;
            border-radius: 14px;
            color: #ffffff !important;
            box-shadow: 0 8px 20px -5px rgba(79, 70, 229, 0.45);
            transition: all 0.3s ease;
        }

        .btn-custom-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -6px rgba(79, 70, 229, 0.55);
        }

        .btn-custom-primary:disabled {
            background: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Subtle Logout Link */
        .logout-link {
            transition: all 0.2s ease;
            opacity: 0.8;
            background: rgba(239, 68, 68, 0.1);
            padding: 8px 20px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
        }
        .logout-link:hover {
            opacity: 1;
            background: rgba(239, 68, 68, 0.15);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<!-- Background Orbs -->
<div class="ambient-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
</div>

<!-- Main Glass Card -->
<div class="activation-card text-center mx-3">

    <div class="icon-wrapper">
        <i class="bi bi-shield-check" style="font-size: 3rem; color: #4f46e5;"></i>
    </div>

    <h3 class="fw-bold mb-2" style="letter-spacing: -0.5px;">Activate Account</h3>
    <p class="text-muted small mb-4" style="line-height: 1.6;">
        Welcome to SLIIT Helpdesk! For your security, please update your default password before accessing the system.
    </p>

    <!-- Error Message Area (If Backend sends an error, it will show here) -->
    <div th:if="${param.error != null}" class="alert alert-danger small fw-bold mb-4 rounded-3 text-start" style="background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #ef4444;">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> Update failed. Please ensure your credentials are correct.
    </div>

    <!-- Enhanced Update Password Form -->
    <form th:action="@{/user/update-first-password}" method="POST" id="activationForm" class="text-start">

        <!-- We use the required fields here, maintaining backend compatibility -->
        <div class="mb-3">
            <label class="form-label fw-bold small text-muted ms-1 text-uppercase" style="letter-spacing: 0.5px;">New Password</label>
            <input type="password" name="newPassword" id="newPassword" class="form-control form-control-lg form-control-glass rounded-4" required placeholder="Enter a strong password">
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold small text-muted ms-1 text-uppercase" style="letter-spacing: 0.5px;">Confirm New Password</label>
            <input type="password" id="confirmPassword" class="form-control form-control-lg form-control-glass rounded-4" required placeholder="Re-enter the new password">
            <!-- Dynamic Error Message Container -->
            <div id="passwordError" class="invalid-feedback fw-bold mt-2 ps-2" style="display: none; font-size: 0.8rem;">
                <i class="bi bi-x-circle-fill me-1"></i> Passwords do not match!
            </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-custom-primary btn-lg w-100 fw-bold" disabled>
            <i class="bi bi-check2-circle me-1"></i> Update & Proceed
        </button>
    </form>

    <div class="mt-4 pt-3 border-top border-secondary border-opacity-25">
        <a th:href="@{/logout}" class="text-danger small fw-bold text-decoration-none logout-link">
            <i class="bi bi-box-arrow-left me-2"></i> Logout for now
        </a>
    </div>

</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Real-time Password Validation Script -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const newPwd = document.getElementById('newPassword');
        const confirmPwd = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('passwordError');
        const form = document.getElementById('activationForm');

        // Function to check if passwords match
        function checkPasswords() {
            const val1 = newPwd.value;
            const val2 = confirmPwd.value;

            // Only start validating if the user has typed something in the confirm box
            if (val2.length > 0) {
                if (val1 === val2) {
                    // Match!
                    confirmPwd.classList.remove('is-invalid');
                    confirmPwd.classList.add('is-valid');
                    errorMsg.style.display = 'none';
                    submitBtn.disabled = false;
                } else {
                    // Mismatch!
                    confirmPwd.classList.remove('is-valid');
                    confirmPwd.classList.add('is-invalid');
                    errorMsg.style.display = 'block';
                    submitBtn.disabled = true;
                }
            } else {
                // Confirm box is empty
                confirmPwd.classList.remove('is-valid', 'is-invalid');
                errorMsg.style.display = 'none';
                submitBtn.disabled = true;
            }
        }

        // Listen for typing events on both fields
        newPwd.addEventListener('input', checkPasswords);
        confirmPwd.addEventListener('input', checkPasswords);

        // Extra safety: prevent form submission if disabled (though the button attribute handles this too)
        form.addEventListener('submit', function(e) {
            if (newPwd.value !== confirmPwd.value) {
                e.preventDefault();
            }
        });
    });
</script>

</body>
</html>
