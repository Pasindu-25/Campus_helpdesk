spring.application.name=helpdesk
spring.datasource.url= database url
spring.datasource.username= database username
spring.datasource.password= databse password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username= your email
spring.mail.password= your email app password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
logging.level.org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl=ERROR
